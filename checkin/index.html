<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B1B2F">
<meta name="color-scheme" content="dark">
<title>Spoilies: Movies &amp; TV with Friends · iMessage App</title>
<meta name="description" content="Keep the chat spoiler-free. Rate and talk about the biggest movies and TV shows with your friends in iMessage, in one-on-one and group chats.">
<!-- link previews (the bubble iMessage shows when someone sends this link) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Spoilies">
<meta property="og:title" content="Spoilies">
<meta property="og:description" content="Keep the chat spoiler-free. Rate and talk about the biggest movies and TV shows with your friends in iMessage, in one-on-one and group chats.">
<meta property="og:url" content="https://spoilies.app/checkin">
<meta property="og:image" content="https://spoilies.app/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A blue chat bubble in a gold spotlight, above the Spoilies name">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="/apple-touch-icon.png?v=2">
<!-- a page for card links, not for search results -->
<meta name="robots" content="noindex">
<!-- spoilies.app (FEAT-007, FEAT-040). No scripts that run: the page never reads the link (card links carry the chat key after #). -->
<style>
  :root {
    --bg: #1B1B2F;          /* house navy (app icon) */
    --bg-deep: #12121F;
    --text: #FFFFFF;
    --muted: #B4B4CC;       /* cool grey that reads on navy */
    --gold: #F5C842;        /* stage gold */
    --beam: #FFE08A;        /* spotlight gold */
    --blue: #0A84FF;        /* iMessage blue */
  }
  * { box-sizing: border-box; margin: 0; }
  /* Safari colours its status bar and toolbar from the html background, so it must be dark too */
  html { background: var(--bg); color-scheme: dark; }
  html { height: 100%; }  /* body grows with the page, so its gradient reaches the bottom */
  body {
    background: radial-gradient(ellipse at 50% 30%, #262642 0%, var(--bg) 55%, var(--bg-deep) 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden;
  }

  /* ---------- copy ---------- */
  main { text-align: center; padding: 6px 16px 40px; flex: 1; position: relative; z-index: 3; }
  .logo { font-size: clamp(44px, 9vw, 76px); font-weight: 800; letter-spacing: -.03em; }
  .logo span { color: var(--gold); }
  .tag { margin-top: 10px; font-size: clamp(17px, 2.6vw, 22px); color: var(--muted); max-width: 30ch; margin-inline: auto; line-height: 1.35; }
  .store {
    display: inline-flex; align-items: center; gap: 10px; margin-top: 30px;
    background: #fff; color: #000; text-decoration: none;
    padding: 12px 22px; border-radius: 12px; font-weight: 600; font-size: 17px;
  }
  .store.soon { cursor: default; text-align: left; }
  .store small { display: block; font-size: 11px; font-weight: 500; text-align: left; }
  .store svg { width: 26px; height: 26px; }
  .note { margin-top: 14px; font-size: 13px; color: var(--muted); }
  .features {
    list-style: none; padding: 0; margin: 34px auto 0; max-width: 760px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; text-align: left;
  }
  .features strong { display: block; font-size: 15px; color: var(--text); margin-bottom: 4px; }
  .features span { font-size: 14px; line-height: 1.4; color: var(--muted); }
  @media (max-width: 600px) { .features { grid-template-columns: 1fr; max-width: 320px; gap: 16px; } }
  footer { text-align: center; font-size: 12px; color: #6b6861; padding: 0 16px 24px; }
  footer a { color: inherit; }


  /* ---------- spotlight stage (FEAT-046, agreed 2026-11-09): the app icon at full size ---------- */
  .hero { position: relative; flex: none; height: 300px; margin: 0 auto; width: min(100%, 560px); }
  .hero svg.light { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .beam { animation: glow 7s ease-in-out infinite; }
  .bubble-big { position: absolute; left: 50%; top: 118px; width: 150px; height: 108px; margin-left: -75px;
    background: var(--blue); border-radius: 36px; box-shadow: 0 18px 40px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center; gap: 14px; }
  .bubble-big::after { content: ""; position: absolute; left: 28px; bottom: -22px; width: 0; height: 0;
    border-left: 12px solid transparent; border-right: 34px solid transparent; border-top: 30px solid var(--blue); transform: skewX(-12deg); }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: #fff; animation: typing 1.4s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: .18s; } .dot:nth-child(3) { animation-delay: .36s; }
  @keyframes glow { 0%,100% { opacity: .92; } 50% { opacity: 1; } }
  @keyframes typing { 0%,60%,100% { transform: translateY(0); opacity: .75; } 30% { transform: translateY(-6px); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .beam, .dot { animation: none; } }
  @media (max-width: 600px) {
    .hero { height: 240px; }
    .bubble-big { top: 92px; width: 116px; height: 84px; margin-left: -58px; border-radius: 28px; gap: 11px; }
    .bubble-big::after { left: 20px; bottom: -18px; border-left-width: 10px; border-right-width: 26px; border-top-width: 24px; }
    .dot { width: 14px; height: 14px; }
  }
  footer { color: #8a8aa8; }
  .headline { margin-top: 6px; font-size: clamp(22px, 5vw, 30px); font-weight: 700; letter-spacing: -.01em; color: var(--text); }
  .headline + .tag { margin-top: 8px; }
</style>
</head>
<body>

<div class="hero" aria-hidden="true">
  <svg class="light" viewBox="0 0 400 300" preserveAspectRatio="xMidYMin meet">
    <defs>
      <linearGradient id="beamFade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFE08A" stop-opacity=".95"/>
        <stop offset=".75" stop-color="#FFE08A" stop-opacity=".55"/>
        <stop offset="1" stop-color="#FFE08A" stop-opacity=".25"/>
      </linearGradient>
      <radialGradient id="pool" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#F5C842" stop-opacity=".95"/>
        <stop offset=".7" stop-color="#F5C842" stop-opacity=".45"/>
        <stop offset="1" stop-color="#F5C842" stop-opacity="0"/>
      </radialGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    </defs>
    <polygon class="beam" points="168,-20 232,-20 372,262 28,262" fill="url(#beamFade)" filter="url(#soft)"/>
    <ellipse cx="200" cy="262" rx="176" ry="28" fill="url(#pool)"/>
  </svg>
  <div class="bubble-big"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</div>

<main>
  <h1 class="logo">Spoil<span>ies</span></h1>
  <p class="headline">Open this card on your iPhone</p>
  <p class="tag">Spoilies is an iMessage app for iPhone. Open this card in Messages on an iPhone to see the chat.</p>
  <!-- Before release: a button that goes nowhere. At launch, swap it for the App Store link:
       <a class="store" href="(App Store link)"> Apple logo + <small>Download on the</small>App Store </a> -->
  <span class="store soon">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.6c0-2.5 2-3.7 2.1-3.8-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.1 2.5-1.8 3.1-.5 7.6 1.3 10.1.8 1.2 1.8 2.6 3.1 2.5 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.4-.9-2.4-4.1zM14 5.1c.7-.8 1.1-1.9 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z"/></svg>
    <span>Coming soon to iMessage</span>
  </span>
  <p class="note">Free · iPhone · works in iMessage</p>
</main>

<footer>© 2026 Spoilies · <a href="/privacy/">Privacy</a> · <a href="/faq/">FAQ</a></footer>

</body>
</html>
